name: CI Pipeline

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]


jobs:
  tests:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run DAG integrity tests
        env:
          AIRFLOW_VAR_DATA_LAKE_PATH: /tmp/airflow-data
        run: |
          pytest tests/test_dag_integrity.py -v

      - name: Run Bronze integration tests
        env:
          AIRFLOW_VAR_DATA_LAKE_PATH: /tmp/airflow-data
        run: |
          pytest tests/test_bronze_ingestion.py -v

      - name: Run Silver integration tests
        env:
          AIRFLOW_VAR_DATA_LAKE_PATH: /tmp/airflow-data
        run: |
          pytest tests/test_silver_integration.py -v