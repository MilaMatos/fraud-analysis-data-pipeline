x-airflow-common:
  &airflow-common
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'ef191fa90e2e82e063c8ae502075f3a00e4eb2de2836dcbfc6880ece95c43f23'
    AIRFLOW__CORE__FERNET_KEY: '46BKJoQYlPPOexq0OhDZnIlNepKFf8Ep8_C_cszBWTE='
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy

services:
  # Container apenas para garantir permissoes nas pastas
  setup-permissions:
    image: alpine:latest
    user: "root"
    volumes:
      - ./data:/data
    command: sh -c "mkdir -p /data/bronze /data/silver && chmod -R 777 /data"

  # Banco Postgres (Backend e Camada Gold)
  postgres:
    image: postgres:13
    depends_on:
      setup-permissions:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    ports:
      - "5432:5432"

  # Interface Web
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      retries: 5

  # Agendador
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  # Inicialização do banco e usuário admin
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin

  # UI Streamlit
  lakehouse-observability:
    build: .
    entrypoint: /bin/bash
    command: -c "streamlit run app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/opt/airflow/data
      - ./app.py:/opt/airflow/app.py
      - ./data_catalog.json:/opt/airflow/data_catalog.json
    depends_on:
      - airflow-init